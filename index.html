<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<title>PrivateMatch</title>
<meta name="description" content="PrivateMatch — 知り合いと気軽にポーカーの SIT & GO。部屋番号や招待 URL で集まって、ポーカーチェイスと同じストラクチャーで遊べます。">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0D0F13">
<meta name="apple-mobile-web-app-title" content="PrivateMatch">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css">
<script src="/theme.js"></script>
</head>
<body data-screen="menu">
<div class="app">
  <header class="top">
    <div class="brand"><span>PrivateMatch</span></div>
    <nav class="navpill" aria-label="メニュー">
      <button class="nbtn" id="rulesBtn" type="button" aria-label="Rules">?</button>
      <button class="nbtn ingame retire" id="leaveBtn" type="button">Leave</button>
    </nav>
    <div class="top-r">
      <button class="hbtn ingame" id="chatLogBtn" type="button" aria-label="Chat" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="miter" aria-hidden="true"><path d="M3 4h18v12H9l-5 4v-4H3z"/></svg><i class="badge" hidden></i></button>
      <button class="hbtn ingame" id="handLogBtn" type="button" aria-label="Hand history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 3h12l4 4v14H4z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg></button>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="表示テーマを切り替える"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></button>
    </div>
  </header>

  <section class="menu" id="menu" aria-label="メニュー"><div class="menu-in" id="menuIn"></div></section>

  <main class="stage" id="stage" aria-label="テーブル">
    <div class="tinfo" id="tInfo"></div>
    <div class="table" id="table">
      <div class="felt" aria-hidden="true"></div>
      <div class="mid" id="mid">
        <div class="pot" id="pot"></div>
        <div class="boardc" id="boardC" aria-label="Community cards"></div>
      </div>
      <div id="seats"></div>
      <div class="betm" id="betM"></div>
      <button class="chat-btn" id="chatBtn" type="button" aria-label="Chat" aria-pressed="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="miter" aria-hidden="true"><path d="M3 4h18v12H9l-5 4v-4H3z"/><path d="M7.5 10h.01M12 10h.01M16.5 10h.01" stroke-width="2.6" stroke-linecap="square"/></svg></button>
    </div>
    <div class="chat-bubbles" id="chatBubbles" aria-live="polite" hidden></div>
    <div class="dock" id="dock" aria-live="polite"></div>
  </main>

  <footer class="foot">
    <span>無料・広告なし。チップに価値はありません。成績とハンド履歴はこの端末に保存されます。</span>
  </footer>
</div>

<div class="toast" id="toast" role="status"></div>

<dialog id="leaveDlg" class="sm"><div class="dlg" id="leaveBody"></div></dialog>
<dialog id="overDlg"><div class="dlg" id="overBody"></div></dialog>
<dialog id="joinDlg" class="sm"><button class="x" data-close type="button" aria-label="閉じる"></button><div class="dlg" id="joinBody"></div></dialog>
<dialog id="profDlg" class="sm"><button class="x" data-close type="button" aria-label="閉じる"></button><div class="dlg" id="profBody"></div></dialog>
<dialog id="rulesDlg"><button class="x" data-close type="button" aria-label="閉じる"></button><div class="dlg" id="rulesBody"></div></dialog>
<dialog id="chatDlg" class="glass-dlg"><button class="x" data-close type="button" aria-label="閉じる"></button><div class="dlg" id="chatBody"></div></dialog>
<dialog id="handsDlg" class="glass-dlg"><button class="x" data-close type="button" aria-label="閉じる"></button><div class="dlg" id="handsBody"></div></dialog>
<dialog id="handDlg"><button class="x" data-close type="button" aria-label="閉じる"></button><div class="dlg" id="handBody"></div></dialog>

<script type="module" src="/src/main.js"></script>
</body>
</html>
