# サーバー側のデプロイ（すべて GitHub 上で行う）。
#   main に push → テスト → Neon の準備（Neon Auth・Google・Data API）・マイグレーション・Function "game" の配備（production）
#   → 本番の公開の住所を .env.production / src/prodConfig.js に書いて main にコミット
#   → Cloudflare Pages（GitHub 連携）がそのコミットを見てサイトをビルド・公開する
#   Actions タブ → Deploy → Run workflow で、dev ブランチ（開発用の Neon）だけを更新することもできる
# 必要な設定（docs/SETUP.md）
#   Neon の GitHub 連携が入れるもの: Secret NEON_API_KEY, Variable NEON_PROJECT_ID
#   任意: Variables APP_ORIGIN（既定 https://<CF_PAGES_PROJECT>.pages.dev）, CF_PAGES_PROJECT（既定 privatematch）, NEON_PROD_BRANCH（既定 production。無ければ Neon の既定のブランチ）
#         Secrets GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET（自前の Google OAuth クライアント）
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 更新する先
        type: choice
        options: [production, dev]
        default: production

concurrency:
  group: deploy-${{ inputs.target || 'production' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN || format('https://{0}.pages.dev', vars.CF_PAGES_PROJECT || 'privatematch') }}
      TARGET: ${{ inputs.target || 'production' }}
      BRANCH: ${{ (inputs.target || 'production') == 'dev' && 'dev' || (vars.NEON_PROD_BRANCH || 'production') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 単体テスト
        run: npm test

      - name: 設定の確認
        id: cfg
        run: |
          missing=""
          [ -n "$NEON_API_KEY" ] || missing="$missing NEON_API_KEY(secret)"
          [ -n "$NEON_PROJECT_ID" ] || missing="$missing NEON_PROJECT_ID(variable)"
          if [ -n "$missing" ]; then
            echo "::warning::Neon の設定が足りないので配備を飛ばします:$missing（Neon の GitHub 連携でこのリポジトリを選ぶと入ります。docs/SETUP.md）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Neon の準備（ブランチ・Neon Auth・Google・Data API・信頼するドメイン）
        id: neon
        if: steps.cfg.outputs.ready == 'true'
        env:
          ALLOW_LOCALHOST: ${{ env.TARGET == 'dev' && '1' || '0' }}
          VITE_NEON_AUTH_URL: ${{ vars.VITE_NEON_AUTH_URL }}
          VITE_NEON_DATA_API_URL: ${{ vars.VITE_NEON_DATA_API_URL }}
        run: node scripts/setup-neon.mjs --branch "$BRANCH"
      - name: マイグレーション
        if: steps.cfg.outputs.ready == 'true'
        env:
          NB: ${{ steps.neon.outputs.branch }}
        run: |
          npm run db:migrate -- --branch "$NB"
          node node_modules/neonctl/bin/cli.js data-api refresh-schema --branch "$NB" --database neondb --project-id "$NEON_PROJECT_ID" || true
      - name: Function "game" の配備
        id: fn
        if: steps.cfg.outputs.ready == 'true'
        env:
          NB: ${{ steps.neon.outputs.branch }}
        run: npm run deploy:game -- --branch "$NB"

      - name: 本番の住所をコミット（Cloudflare Pages がこれを見てサイトを作り直す）
        if: steps.cfg.outputs.ready == 'true' && env.TARGET == 'production'
        env:
          AUTH_URL: ${{ steps.neon.outputs.auth_url }}
          DATA_URL: ${{ steps.neon.outputs.data_url }}
          GAME_URL: ${{ steps.fn.outputs.game_url }}
        run: |
          node scripts/write-config.mjs
          if ! git diff --quiet -- .env.production src/prodConfig.js; then
            npm run build
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add .env.production src/prodConfig.js
            git commit -m "chore(deploy): 本番の Neon の住所を更新"
            git push origin HEAD:main
          fi
      - name: 疎通の確認（Function・Data API・サイトのログイン中継）
        if: steps.cfg.outputs.ready == 'true' && env.TARGET == 'production'
        env:
          DATA_URL: ${{ steps.neon.outputs.data_url }}
          GAME_URL: ${{ steps.fn.outputs.game_url }}
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          g=$(code -X POST -H "Origin: $APP_ORIGIN" -d '{}' "$GAME_URL"); echo "Function game（トークン無し → 401 が正しい）: $g"
          d=$(code -X POST -H 'Content-Type: application/json' -d '{}' "$DATA_URL/rpc/me"); echo "Data API me（トークン無し → 401 が正しい）: $d"
          s=000
          for i in $(seq 1 30); do s=$(code "$APP_ORIGIN/api/auth/ok"); [ "$s" = 200 ] && break; sleep 10; done
          echo "サイトのログイン中継 /api/auth/ok（200 が正しい。Cloudflare のビルド待ちで最大 5 分）: $s"
          {
            echo "### 疎通"
            echo "- Function game: $g（401 で正常）"
            echo "- Data API: $d（401 で正常）"
            echo "- $APP_ORIGIN/api/auth/ok: $s（200 で正常）"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$g" = 401 ] && [ "$s" = 200 ] || { echo "::error::疎通の確認に失敗しました"; exit 1; }
      - name: まとめ
        if: steps.cfg.outputs.ready == 'true'
        run: |
          {
            echo "### Deploy ($TARGET / Neon branch ${{ steps.neon.outputs.branch }})"
            echo "- Neon Auth: ${{ steps.neon.outputs.auth_url }}"
            echo "- Data API: ${{ steps.neon.outputs.data_url }}"
            echo "- Function game: ${{ steps.fn.outputs.game_url }}"
            if [ "$TARGET" = production ]; then echo "- Site: $APP_ORIGIN（Cloudflare Pages が main からビルド）"; fi
          } >> "$GITHUB_STEP_SUMMARY"
