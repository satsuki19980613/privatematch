# 秘密情報の検査（gitleaks）。全ブランチの全履歴から、API キー・トークン・パスワード・秘密鍵などが
# コミットされていないかを調べ、見つかれば失敗にする。誤検知は .gitleaksignore に指紋を書いて外す。
# push・プルリクエスト・毎週火曜に走る。
name: Secrets

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  schedule:
    - cron: '37 1 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.21.2
      # gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz の SHA-256（公式の checksums.txt と同じ値）
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks を入れる（版を固定し、ハッシュを照合する）
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto =https --tlsv1.2 -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
      - name: 全履歴を検査する
        run: ./gitleaks git --no-banner --redact --verbose --log-opts="--all" .
